name: Recordatorios de WhatsApp
# Cada 30 minutos entre las 8 y las 21 de Argentina (11 a 00 UTC). El endpoint igual revisa la hora.
on:
  schedule:
    - cron: "5,35 11-23 * * *"
  workflow_dispatch:
jobs:
  correr:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      # Con el secreto RECORDATORIOS_SECRET cargado en GitHub y en Vercel, la ruta solo acepta este llamado.
      # Orden para activarlo: primero el secreto de GitHub, después la variable de Vercel (si no, se cortan).
      - run: curl -fsS --max-time 120 -H "Authorization: Bearer $CLAVE" https://www.acopiosaludable.com/api/whatsapp/recordatorios
        env:
          CLAVE: ${{ secrets.RECORDATORIOS_SECRET }}
