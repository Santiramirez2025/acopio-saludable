name: Seguridad
# En cada PR: que no se agreguen claves ni tokens (scripts/buscar-secretos.ts). Solo lee el repo.
# El aviso de dependencias (npm audit) es informativo: no frena el PR.
on:
  pull_request:
permissions:
  contents: read
jobs:
  secretos:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Buscar secretos en lo agregado
        run: npx --yes tsx@4.19.2 scripts/buscar-secretos.ts "origin/${{ github.base_ref }}"
      - name: Dependencias con vulnerabilidades críticas (informativo)
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=critical --package-lock-only
